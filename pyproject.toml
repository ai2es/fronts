[project]
name = "fronts"
version = "0.2.0"
description = "FrontFinder AI for finding various frontal and baroclinic boundaries"
requires-python = ">=3.12,<=3.14.5"
keywords = [
    "weather",
    "weather fronts",
    "cold fronts",
    "unet",
    "frontal boundary",
    "machine learning",
    "artificial intelligence",
    "ai",
    "ml",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
license = "CC0-1.0"
license-files = [
    "LICENSE",
]
readme = "README.md"
dependencies = [
    "dacite>=1.9.2,<2",
    "icechunk>=2",
    "psutil>=7.2.2",
    "nvidia-ml-py>=12.0.0",
    "pyyaml>=6.0",
    "scipy>=1.13.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
numpy = ">=2, <2.1"
dacite = ">=1.9.2,<2"
ipykernel = ">=7.2.0,<8"
dask-jobqueue = ">=0.9.0,<0.10"
tqdm = ">=4.67.3,<5"
pyyaml = ">=6.0"
cartopy = ">=0.24.0"
matplotlib = ">=3.9.0"
regionmask = ">=0.13.0"
scipy = ">=1.13.0"
arraylake = ">=1.0.3,<2"

[tool.pixi.pypi-dependencies]
fronts = { path = ".", editable = true }

[tool.pixi.feature.train]
platforms = ["linux-64"]

[tool.pixi.feature.train.activation]
env = { CXX = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++", CC = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gcc" }

[tool.pixi.feature.train.dependencies]
cxx-compiler = ">=1.0"
pandas = ">=2.3.3,<3"
shapely = ">=2.0.1,<3"
regionmask = ">=0.13.0,<0.14"
wandb = ">=0.24"
netcdf4 = ">=1.6.2,<2"
dask = ">=2023.3.0"
distributed = ">=2023.3.0"
xarray = ">=2025.07.1"
scikit-image = ">=0.22.0"
h5py = ">=3.11.0"
xbatcher = ">=0.4.0,<0.5"
gcsfs = ">=2026.2.0,<2027"
cartopy = ">=0.24.0"
matplotlib = ">=3.9.0"

[tool.pixi.feature.train.pypi-dependencies]
tensorflow = { extras = ["and-cuda"] }
obstore = "*"
s3fs = ">=2024.6.0"

[tool.pixi.feature.train.tasks]
train = "python -m fronts.train --config configs/default.yaml"
experiment = "python -m fronts.experiments"
eval = { cmd = "echo 'eval script not yet implemented'", description = "Run model evaluation (placeholder)" }

[tool.pixi.system-requirements]
libc = "2.17"

[tool.pixi.feature.schooner]
platforms = ["linux-64"]

[tool.pixi.feature.schooner.tasks]
generate = "python -m fronts.data.generate --config configs/generate_icechunk.yaml"

[tool.pixi.feature.schooner.activation]
env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" }

[tool.pixi.feature.schooner.dependencies]
libstdcxx-ng = ">=12"
protobuf = ">=3.20,<6"

[tool.pixi.feature.schooner.pypi-dependencies]
optree = "<=0.16.0"
dask_jobqueue = "==0.9.0"
tensorflow = { version = ">=2.16,<2.19", extras = ["and-cuda"] }

[tool.pixi.feature.test.dependencies]
python = ">=3.10,<3.14"
dacite = ">=1.9.2,<2"
pytest = ">=8"
xarray = ">=2024"
xbatcher = ">=0.4.0,<0.5"
icechunk = ">=2"
pandas = ">=2"
numpy = ">=2,<2.1"

[tool.pixi.feature.test.tasks]
test = "PYTHONPATH=src python -m pytest tests/ -v"

[tool.pixi.environments]
schooner = { features = ["train", "test", "schooner"], solve-group = "schooner" }
linux = { features = ["train", "test"], solve-group = "linux" }

[dependency-groups]
dev = [
    "deptry>=0.23.0",
    "isort>=6.0.1",
    "lxml-stubs>=0.5.1",
    "mypy>=1.14.1",
    "pandas-stubs>=2.3.0.250703",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pyrefly>=1.0.0",
    "ruff>=0.9.4",
    "types-pytz>=2025.2.0.20250809",
    "types-pyyaml>=6.0.12.20241230",
    "types-tqdm>=4.67.0.20250809",
    "twine>=5.1.1",
]

test = [
    "pandas>=2",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "xarray>=2024",
    "xbatcher>=0.4.0,<0.5",
]

#TODO: swap wget with requests in code
data = ["cdsapi", "wget"]
train = ["zarr>=3.1.5,<4", "icechunk>=2"]

[build-system] 
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/fronts"]

[tool.hatch.build.targets.sdist]
include = ["src/fronts/**/*"]

[tool.pixi.package] 
name = "fronts"
version = "0.2.0"

[tool.pixi.package.host-dependencies] 
hatchling = ">=1.26.3"

[tool.pixi.package.build] 
backend = { name = "pixi-build-python", version = "0.4.*" }

[tool.pyrefly]
python-interpreter = ".pixi/envs/default/bin/python"
ignore-missing-imports = ["tensorflow", "tensorflow.keras.layers", "tensorflow.keras.models", "wandb"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle (Google convention below)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "G",    # flake8-logging-format
    "PL",   # pylint
    "RUF",  # ruff native rules
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports (enforces absolute imports)
]
ignore = [
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__ (not required by Google style)
    "G004",    # f-string in logging (acceptable in ML/research code)
    "PLC0415", # import not at top level (intentional for tensorflow/wandb — see CLAUDE.md)
    "PLR0912", # too many branches (complex ML architecture build functions)
    "PLR0913", # too many arguments (common in model/layer constructors)
    "PLR0915", # too many statements (model build and script entry points)
    "PLR2004", # magic value comparison (common in ML code)
    "SIM108",  # ternary operator (can reduce readability)
    "UP046",   # Generic class type parameters (style choice, not a bug)
    "UP047",   # Generic function type parameters (style choice, not a bug)
]

[tool.ruff.lint.per-file-ignores]
"src/fronts/layers/losses.py" = ["N806"]        # scientific notation: O_n, M_n, MSE, FSS
"src/fronts/layers/metrics.py" = ["N806"]       # scientific notation: O_n, M_n, MSE, FSS
"tests/**/*.py" = ["D101", "D102", "D103"]        # test names are self-documenting

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["fronts"]
known-third-party = ["wandb"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"



