# model_1702 over CONUS restricted to the 6-hourly timestep grid — the fair head-to-head
# against 2.0 baselines whose input store is 6-hourly.

harness_eval_config:
  model_path: "/ourdisk/hpc/ai2es/tman/models/model_1702/model_1702.h5"
  model_kind: "model_1702"
  outdir: "/ourdisk/hpc/ai2es/tman/models/stats/model_1702/model_1702_conus_6h/"
  coordinates: [25.0, 56.75, 228.0, 299.75]
  regions: [full, land, ocean]
  front_types: [CF, WF, SF, OF, DL]
  front_dilation: 1
  batch_size: 8
  time_start: "2019-01-01T00:00:00"
  time_end: "2020-01-01T00:00:00"
